services:
  relay:
    build: .
    restart: unless-stopped
    ports:
      - '${BIND:-127.0.0.1}:47821:47821'
    volumes:
      - relay-data:/data
    environment:
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env to create the admin on first start}
      ADMIN_HANDLE: ${ADMIN_HANDLE:-admin}
      ADMIN_NAME: ${ADMIN_NAME:-Admin}
      TRUST_PROXY: ${TRUST_PROXY:-}
      PUBLIC_URL: ${PUBLIC_URL:-}

  tailscale:
    image: tailscale/tailscale:stable
    restart: unless-stopped
    profiles: ['tailscale']
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_HOSTNAME: ${TS_HOSTNAME:-relay}
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: 'true'
      TS_SERVE_CONFIG: /config/serve.json
    volumes:
      - ./data/tailscale:/var/lib/tailscale
      - ./tailscale/serve.json:/config/serve.json:ro

  backup:
    image: alpine
    profiles: ['tools']
    volumes:
      - relay-data:/data:ro
      - ./data/backups:/backup
    command: sh -c 'tar -czf "/backup/relay-$$(date +%Y%m%d-%H%M%S).tgz" -C /data . && ls -l /backup'

  restore:
    image: alpine
    profiles: ['tools']
    volumes:
      - relay-data:/data
      - ./data/backups:/backup:ro
    command: sh -c 'test -n "$$FILE" && test -f "/backup/$$FILE" && tar -xzf "/backup/$$FILE" -C /data && echo restored "$$FILE"'

volumes:
  relay-data:
    name: relay_relay-data
